<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Networking Lab 2 - Sequential Mini Web Application</title>
    <link rel="icon" href="/images/logo.png" type="image/png">
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
        header img { height: 48px; vertical-align: middle; margin-right: 12px; }
        section { margin-bottom: 28px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input { padding: 6px 8px; margin-right: 8px; }
        button { padding: 6px 14px; cursor: pointer; }
        button:disabled { opacity: 0.6; cursor: wait; }
        .result { margin-top: 10px; padding: 8px; background: #f0f7f0; border-radius: 4px; display: none; }
        .error { margin-top: 10px; padding: 8px; background: #fbeaea; color: #7a1f1f; border-radius: 4px; display: none; }
        .gallery img { max-width: 140px; margin-right: 10px; border-radius: 6px; }
        .loading { font-style: italic; opacity: 0.7; }
    </style>
</head>
<body>
    <header>
        <img src="/images/logo.png" alt="Lab logo">
        <h1 style="display:inline">Sequential Mini Web Application</h1>
    </header>
    <p>This page is served by a single-connection-at-a-time Java HTTP server. Every action below
       calls the server asynchronously, without reloading the page.</p>

    <section>
        <h2>Greeting service</h2>
        <form id="greeting-form">
            <label for="greeting-name">Name</label>
            <input id="greeting-name" name="name" type="text" placeholder="e.g. Ada" required>
            <button type="submit">Greet me</button>
        </form>
        <div id="greeting-result" class="result"></div>
        <div id="greeting-error" class="error"></div>
    </section>

    <section>
        <h2>Square service</h2>
        <form id="square-form">
            <label for="square-value">Number</label>
            <input id="square-value" name="value" type="number" step="any" placeholder="e.g. 7" required>
            <button type="submit">Square it</button>
        </form>
        <div id="square-result" class="result"></div>
        <div id="square-error" class="error"></div>
    </section>

    <section>
        <h2>Server time</h2>
        <button id="time-button" type="button">Get server time</button>
        <div id="time-result" class="result"></div>
        <div id="time-error" class="error"></div>
    </section>

    <section class="gallery">
        <h2>Static images served by this server</h2>
        <img src="/images/logo.png" alt="Lab logo">
        <img src="/images/banner.png" alt="Lab banner">
    </section>

    <script src="/app.js"></script>
</body>
</html>
